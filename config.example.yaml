# EvernightRealm 服務端配置示例（脫敏模板）
#
# 使用方法：複製本檔案為執行資料目錄中的 config.yaml 後按需修改。
# 本檔案不含任何真實憑據；真實金鑰與配置只存在於 evernight-data/config.yaml，
# 該目錄已被 .gitignore 排除，不會進入版本庫。
#
# 注意：以下鍵為規劃結構，隨開發步驟逐步落地；未實現的鍵將被忽略。

# ---- 伺服器 ----
server:
  listen: "127.0.0.1:5206"          # HTTP 監聽地址；區域網部署時改為主機區域網 IP
  data_dir: "."                     # 執行資料目錄（預設 evernight-data/）
  display_timezone: "Asia/Shanghai" # 伺服器顯示時區；資料庫仍以 UTC 儲存

  # HTTP 層保護參數（單位：毫秒 / 位元組）；request 不得大於 write。
  read_header_timeout_ms: 5000      # 標頭讀取逾時
  read_timeout_ms: 15000            # 整個請求讀取逾時
  write_timeout_ms: 30000           # 回應寫入逾時
  idle_timeout_ms: 60000            # keep-alive 空閒逾時
  request_timeout_ms: 10000         # 單次處理期限（超過回 503）
  max_body_bytes: 1048576           # JSON 請求體上限（1 MiB）
  shutdown_timeout_ms: 10000        # 優雅停止等待進行中請求的上限（逾時強制關閉）

# ---- 資料庫 ----
database:
  path: "evernight.db"              # SQLite 檔案（相對 data_dir）
  busy_timeout_ms: 5000             # 鎖等待超時
  preflight: "header"               # 開庫前預檢：header（檔頭標記，預設）| readonly（另加唯讀連線）| off（不預檢）
  integrity_check: false            # 啟動時執行完整性自檢（大庫可能耗時）；亦可手動 `migrate --verify`
  schema_guard: "startup"           # 寫入把關層級：startup（預設，僅啟動時拒絕不相容版本）| transaction（另於每個寫入交易前複驗 schema 版本）
  # ---- 交易邊界 ----
  transaction:
    begin_mode: "immediate"         # 寫入交易的 BEGIN 模式：immediate（預設，失敗點固定於交易開始前）| deferred
    nested: "reject"                # 同一交易內再開交易：reject（預設）| savepoint（真嵌套）| reuse（加入外層）
    busy_retry_max: 0               # 忙鎖時自動重試整個交易的次數（0 為預設，不重試；重試會重跑交易，需冪等）
    busy_retry_backoff_ms: 50       # 重試線性退避基數（毫秒）
    timeout_ms: 10000               # 單一交易執行期限（毫秒）；0 表示不限制

# ---- 儲存目錄 ----
media: "media/"                     # 媒體檔案
documents: "documents/"             # 文件
attachments: "attachments/"         # 附件
backups: "backups/"                 # 備份

# ---- 日誌 ----
logs:
  dir: "logs/"
  level: "info"                     # debug | info | warn | error
  file_prefix: "evernight-run"      # 當日檔案名為 <前綴>.<YYYY-MM-DD>.log
  retention_days: 0                 # 保留天數（含當日）；0 = 不限制、永不自動刪除
                                    # 想讓「日誌不會無限增大」必須在這裡設一個正值

# ---- 磁碟空間監測與寫保護（兩個下限全為 0 時不啟用） ----
disk:
  min_free_bytes: 0                 # 剩餘空間的絕對下限（位元組）；0 = 不按絕對值設限
  min_free_percent: 0               # 剩餘空間占卷總容量的下限百分比（如 5 = 5%）；0 = 不按比例設限
                                    # 兩條任一命中即判定空間不足（取較嚴者）；全為 0 時不做寫保護
  check_interval_ms: 10000          # 可用空間讀值的快取期限；0 = 每個寫入前都實測

# ---- 安全（部署者自行生成，勿在此提交真實值） ----
security:
  session_ttl_hours: 24

  # 會話失效與失效記錄清理。判定一律以伺服器時鐘＋資料庫內的時刻為準，
  # 服務重啟不會讓一個已失效的憑據重新可用（沒有進程內倒計時）。
  session_idle_hours: 0             # 閒置有效期（小時）：距最近活動超過即到期；0 = 不啟用閒置判定
                                    # 閒置只把失效時刻往前拉，永不延長絕對期限（活動不可能換來永久登入）；
                                    # 因此設成 >= session_ttl_hours 的值會被絕對期限完全蓋住，啟動摘要會提示這句話
  session_touch_minutes: 5          # 「最近活動時刻」落庫的最小間隔（分鐘）；0 = 每個已認證請求都寫一行
                                    # 正值把寫入降到「每會話每間隔一次」（單寫鎖下避免每請求一寫），
                                    # 閒置線以「上次落庫的活動時刻」起算，因此最多會讓閒置判定早一個間隔；兩者要一起考慮
  session_cleanup_minutes: 30       # 失效會話記錄的背景清理周期（分鐘）；0 = 不起背景清理
                                    # 關掉它不影響安全：失效憑據在請求入口就被拒，清理只是讓記錄別無限堆積
  session_cleanup_grace_hours: 168  # 會話失效後保留其記錄的寬限期（小時）；0 = 失效即刪
                                    # 這段窗口是給運維與未來裝置清單的（「這枚憑據何時失效」還查得到）；
                                    # 它不改變對外機器碼——行已過期與行已刪除對客戶端都是同一個 2003；
                                    # 清理永遠只動會話記錄，不刪任何審計

  # 裝置登入策略：一個主體（Root 也走同一條規則，沒有例外）能同時握有幾份有效會話。
  # 名額由服務端在登入的事務裡算，算的是「此刻還換得出身份」的會話數：
  # 輪換只換秘密不換行，因此不佔新名額；撤銷或到期即刻釋放名額。
  # 登入請求裡沒有任何可自報的裝置欄位——裝置顯示名稱或標識不是認證因子，改它換不來名額。
  device_policy:
    mode: multi                   # single = 一人一機（新登入成功時讓該主體的舊會話全部失效）
                                  # multi  = 允許多裝置並存、不封頂（預設；本鍵存在之前的行為就是這個）
                                  # limited= 並存但封頂，名額已滿時新登入被拒（機器碼 2008，等舊會話到期或從其它裝置登出才會再放行）
    max_devices: 0                # 僅 mode=limited 時必填（1..50）；其它模式必須留 0

  # 帳戶建立策略（管理員可否建普通帳戶、自註冊模式、可否建訪客帳戶）**不在這個檔案裡**：
  # 它是 Root 在已認證的 Root 控制台隨時可改的運作決定，必須對下一個請求立即生效，
  # 因此持久在資料庫的單例表（遷移 0008），並與 Root 稽核落在同一筆交易。
  # 想在檔案裡預設它，等於讓「改檔」與「介面保存」兩個來源各說各話。
  # 端點：GET／PUT /root/account-policy（只有 Root）；登入前可見的對外答案只有一個匿名
  # 唯讀端點 GET /auth/capabilities，內容是三個布林，而且「策略放開」不等於「通路已實作」。
  # 三個布林是 sign_up_open（能不能自行註冊）、invite_code_required（這一趟要不要帶一枚碼，
  # 只在 invite 模式點亮，不把模式名字外洩）與 guest_open（能不能以訪客臨時身分進入）。
  # 它們只驱动界面顯示，真正的准入判定在寫入那一刻由 internal/selfregister 與 internal/guestacct
  # 各自現讀策略重做，前端瞞不過那道檢查。三條建立通路（管理員建號、自註冊、訪客）現在都已落地，
  # 所以這三個布林現在如實等於策略意圖本身——但合成仍舊是「策略 ∧ 通路」，沒有因為翻真而取消。
  # 訪客那一側的通路是一條匿名唯寫端點 POST /auth/guest：本體只有一格可選的 nickname
  # （展示用，可留空由伺服器產生臨時編號），登入名一律由伺服器產生，因此請求裡沒有一格能自報身分
  # 或佔住將來某個真人想用的名字。它刻意與自註冊不同：訪客沒有一般憑據，所以這一步在同一筆交易裡
  # 建號並簽發一枚与普通帳戶完全同規格的會話（同樣受到期、閒置、撤銷與裝置名額約束，
  # 沒有任何特殊 Cookie），同時落下 Root 域審計 account.guest_enter。訪客不帶任何伺服器級授予，
  # 管理端與 Root 端對他一律回 2011；他也沒有「凭暱稱找回」那條路——會話一旦到期、登出或換裝置，
  # 這一趟臨時身分就結束，要處置由管理員在普通帳戶目錄（本就把訪客列進去）核實後另行決定。
  # 其中一種處置現在存在了：PUT /admin/accounts/{account_id}/upgrade 是一條管理員專屬的
  # 「就地升級」通路（NeedServerAdmin；訪客本人敲它只會拿到 2011，不能自我提升）。本體白名單只有
  # login_name 與 password 兩欄，升級給他一檔正式登入名與一次性憑據、must_change_password 落 1，
  # 且帳戶標識、建立時刻、顯示名與既有審計参照全部原樣保留（審計只追加 account.guest_upgrade，
  # 不改寫歷史）。他名下舊訪戶會話與升級在同一筆交易裡全部撤銷，本人必須用新憑據重新登入並先改密；
  # 「綁定到另一個既有正式帳戶」現在有完整的兩段通路，而且兩段都不是同一個人按的：
  # 第一段是管理員的只讀預覽 POST /admin/accounts/{account_id}/bind-preflight（NeedServerAdmin；
  # 本體恰好 target_account_id 一格，一次只評估「這一個訪戶 × 這一個目標」的一对，
  # 不存在替訪戶羅列可綁定目標的讀法）。它純只讀、零寫入（不落審計），
  # 「此刻不可綁定」以 200 預覽帶穩定原因記號回來而不是錯誤碼；來源或目標不在普通帳戶目錄時
  # 與詳情端點同句收斂 1001，預覽不是新的枚舉面。
  # 第二段是簽發：POST /admin/accounts/{account_id}/bind-ticket（仍 NeedServerAdmin，本體同樣
  # 恰好 target_account_id 一格）。它在同一筆交易內把預檢重做一遍，可行才簽出一枚
  # 限定這一對、15 分鐘有效、只准核銷一次的操作憑證（碼內常量，不可經配置加長，也沒有撤銷通路）。
  # 憑證明文只在這一次回應裡出現：庫裡存的是它的 SHA-256，日誌、審計與此後的任何讀法都拿不回來。
  # 簽發仍不是綁定——訪戶未退休、會話未撤、留痕未追加；它落的只有憑證一行與審計一筆。
  # 第三段才是執行，而且只能由憑證上的那個目標帳戶本人以自己的已認證會話發起：
  # POST /auth/guest-bindings/preview（只讀的核銷前預覽）、POST /auth/guest-bindings（核銷並完成綁定）、
  # GET／HEAD /auth/guest-bindings（讀自己接過哪些人，提交後回應遺失時的答案）。
  # 這三道門的主體判定先於任何查詢：訪戶本人、Root、持有伺服器級授予的管理員與匿名一律 2011／2002；
  # 請求本體只有 ticket 一格，沒有任何「我要以誰的身分」可填，因此也沒有自報即生效的空隙。
  # 執行落地的是四件合力（同一筆交易）：核銷憑證、來源訪戶進入 accounts.status='retired' 終態
  # （遷移 0011；行與登入名鍵保留、顯示名不改寫、不給憑據）、源會話全部撤銷、
  # 追加一行不可變的 guest_account_bindings 留痕。任何一跳失敗全部回滾——
  # 連憑證的核銷標記都不留，原先可用關係完整保留。
  # 用戶批准的綁定語意（R2-018 預覽、R2-019 執行）：綁定存續的是目標帳戶標識、訪戶進入不可登入
  # 不可複用的退休終態、歷史引用逐字保留（既有審計不被改寫成「從來都是目標帳戶」）、
  # 目標的憑據與權限不動（不複製哈希、不繼承授予、不把目標狀態覆蓋成來源狀態），
  # 而管理端永遠拿不到代人綁定的按鈕。執行前一定重讀事實並比對簽發時釘住的計劃摘要：
  # 兩側形態變了、資料庫版本推進了、或庫裡多了一張尚未接入綁定預檢的帳戶引用表——
  # 一律以 2026（這份計劃已不合當前事實）回絕並要求重新預檢，2025 則是那枚憑證本身用不了。
  # 本步只動帳戶層：活動名冊、資產帳本與 NPC 關係尚未開發，一旦落地就必須先把自己的引用
  # 接入 internal/stdacct/bindpreflight.go 的處置登記表，否則綁定會被 unknown_references 整體阻止。
  # 三個建立開關不約束這三段通路：
  # 開關管「准不准多出一筆」，而升級與綁定動的是一筆已存在帳戶的形態與歸屬。
  # 誰的申請被批准或拒絕，也不在這個檔案裡，而且不需要任何組態欄位：那是
  # GET /admin/registrations 與 PUT /admin/registrations/{account_id}/decision 兩條路徑，
  # 由 NeedServerAdmin 判定、目标範圍由 internal/acctreview 現讀帳戶現值。審批從不回讀本策略：
  # 模式只管新的提交，Root 事後改成 closed 也不會讓誰的待審批申請消失或變得無法處理。

  # 伺服器級註冊邀請碼（准入憑證）也不在這個檔案裡：簽發、列名冊與撤銷是 Root 在已認證的
  # Root 控制台隨時可做的動作，落在三條路徑上——POST／GET／HEAD /root/invite-codes（簽發與分頁名冊）
  # 與 DELETE /root/invite-codes/{code_id}（撤銷），全部由 NeedRoot 判定、目標形態由 internal/invitecode
  # 現讀。每枚碼有自己的額度上限（max_uses，1 即單次）、可選有效期（到期時刻，0=永不）與撤銷狀態；
  # 可用性在讀用時由注入時鐘派生，沒有排程去翻動它。庫裡只存代碼的 SHA-256 驗證材料、不存明文，
  # 明文只在簽發成功的那一次回應裡出現一次，丟了就重新簽發一枚。
  # 拿一枚有效碼換出一筆帳戶的核銷通路也已落地：它不是另一條端點，而是同一條匿名 POST /auth/register
  # 在 invite 模式下的那一分支——請求本體帶一個 invite_code 欄位，只有當策略此刻生效的模式確為 invite
  # 時才被讀取與核銷；開放／核准模式不看這一格，於是一支碼絕不會在非 invite 那一側被順手吃掉。核銷
  # （internal/invitecode 的 Store.Redeem，帶「未撤銷、未過期、額度未滿」四重 WHERE 的單向 UPDATE）
  # 與建號、審計落在同一筆 BEGIN IMMEDIATE 交易裡：同名衝突、非法口令或寫入失敗都讓那次額度一起回滾、
  # 不誤耗名額；一次性碼在併發下恰好一次生效，重複請求不會多建帳戶或多扣額度。建出的按定義是普通帳戶，
  # 邀請碼不攜帶任何權限，換出的帳戶與開放模式一樣可立即登入（註冊這一步仍不簽發會話）。
  # 三條准入模式（closed／open／approval／invite）現在都寫得進 /root/account-policy；換不出帳戶的碼
  # （缺／壞／過期／撤銷／用盡／併發落敗）一律回不泄露細節的機器碼 2023，這條通路不是逐枚探測碼有效性的探測器。

  # 登入失敗控制與限流（純記憶體狀態：服務重啟即清空，不寫入資料庫）。
  # 計量主軸是「來源位址 × 登入目標」配對：某個帳戶被擋只冷卻「這個位址對這個帳戶」，
  # 同一出口位址後面的其他用戶不受影響；source_fail_limit 是同一位址橫掃大量帳戶時
  # 才會觸發的來源級補集，因此刻意遠高於 fail_limit。
  # 來源位址一律取實際連線（本服務沒有可信代理約定，不採信任何轉發標頭）。
  # 「申請人查本人待審批狀態」（POST /auth/registration-status）沿用這一份帳，而不是另立一條：
  # 它與登入做的是同一件事——拿一枚口令去對一個名字。分账等於給同一個來源多一份猜口令的預算。
  # 提交註冊（/auth/register）則走下方的 register_guard 分账，因為那不交憑據、燒的是另一樣東西。
  login_guard:
    fail_limit: 10                  # 視窗內單一「來源×目標」的失敗上限
    window_minutes: 15              # 失敗計數的滑動視窗（分鐘）
    cooldown_minutes: 15            # 觸發後的冷卻長度（分鐘）；冷卻期內的嘗試不延長它
    source_fail_limit: 50           # 視窗內單一來源跨全部目標的失敗上限（不得低於 fail_limit）
    max_entries: 10000              # 限流條目總數上限（限流自身的記憶體封頂）

  # 匿名自註冊失敗控制與限流：與 login_guard 同型別、共用同一套界限，只是預設更緊。
  # 註冊端點對匿名開放，而「自行選一個唯一登入名」在結構上就是一個存在性探測器——
  # 一次成功即代表這個名字還沒被佔用。防批量探測靠的是這裡的緊限流與下方派生併發封頂，
  # 不是把錯誤訊息整形去掩蓋這件事（對外重名有可判別碼 2019）。目標同樣取登入名正規化鍵：
  # 反覆撞同一個名字撞 fail_limit，橫掃多個不同名字撞 source_fail_limit。
  # 重名與不合規輸入計為失敗；一次成功註冊清掉該「來源×名字」計數。
  #
  # 訪客進入（POST /auth/guest）沿用這一組閾值，但用的是第三份獨立記憶體（另一個守衛實例，
  # 見 internal/app 的裝配）：三個匿名入口各有各的預算，任何一方刷滿都不會把另一條路一起擋死，
  # 而「匿名寫入入口要多緊」仍由這一個地方決定，部署者不必為第三條路再記一組數字。
  # 這條通路的計量單位是「嘗試」而不是「失敗」——成功的那一趟照樣銷預算，目標鍵是固定值而非暱稱
  # （暱稱可自報、可重複，拿它當鍵等於讓攻擊者自己挑要落進哪個條目）。理由很實在：自註冊那側有
  # 「登入名唯一」這條天然自限（反復撞同一個名字只會拿到 2019 並被記一次失敗），而訪客的登入名由
  # 伺服器產生，每次成功都實實在在多出一筆帳戶、一枚會話、一筆審計；只記失敗不記成功，
  # 「開關亮著就無限刷訪客」就不會被任何閾值擋住，而那是策略開關本身管不到的事。
  register_guard:
    fail_limit: 5                   # 反覆撞同一個名字的來源×目標上限
    window_minutes: 15              # 失敗計數的滑動視窗（分鐘）
    cooldown_minutes: 30            # 觸發後的冷卻長度（分鐘）；比登入更久，拉高批量探測時成本
    source_fail_limit: 20           # 單一來源橫掃多個不同名字的來源級上限（不得低於 fail_limit）
    max_entries: 10000              # 限流條目總數上限

  # 同時進入 Argon2id 口令派生的註冊請求數上限（1..64）。超出的請求在訊號量上等待，
  # 可被各自請求的 context 取消；等待期不佔交易、不寫審計、不做派生。
  register_hash_concurrency: 4

  # Root 憑據（root_password_hash）不要在這裡手工填寫：它由伺服器本機的一次性命令寫入，
  # 存進檔案的是 Argon2id 編碼而不是明文口令，而且一旦有值就不再開放第二次初始化。
  #   evernight-server init-root --password-stdin --data-dir <執行資料目錄>
  # 只讀地查看目前有沒有 Root（不會建立目錄或檔案）：
  #   evernight-server root-status --data-dir <執行資料目錄>
  # 環境變數 ER_SECURITY_ROOT_PASSWORD_HASH 會在執行期蓋掉本欄，僅供特殊維運用途；
  # 那種狀態下 init-root 一律拒絕寫入，避免同時存在兩份 Root。

  # HTTP 安全回應頭；留空即用內建預設，只有確實需要時才覆寫。
  # frame_options 可選 DENY | SAMEORIGIN；csp 不得含 'unsafe-eval'。
  headers:
    content_security_policy: ""       # 空 = 內建預設（相容本機 Flutter Web）
    frame_options: ""                 # 空 = DENY
    referrer_policy: ""               # 空 = no-referrer
    permissions_policy: ""            # 空 = camera=(self), microphone=(), geolocation=()

  # 跨來源（CORS）策略。預設完全關閉：不放行任何來源時，服務端不下發任何跨域標頭，
  # 瀏覽器只能同源存取本服務（正式部署即應保持這樣的狀態）。
  # 開發期要讓瀏覽器直接呼叫 Go，才把「頁面的來源」寫進來；也可用環境變數臨時給定：
  #   ER_SECURITY_CORS_ALLOWED_ORIGINS=http://127.0.0.1:8765
  # 啟動摘要會列印 cors=[...]，開啟時還會多一列「跨域提示」，避免忘了改回來。
  cors:
    allowed_origins: []               # 空 = 關閉；每項須為 scheme://host[:port] 精確來源，或 "*"
    allowed_methods: [GET, HEAD, OPTIONS]
    allowed_headers: [Accept, Accept-Language, Content-Type, Idempotency-Key, X-Request-Id]
    exposed_headers: [X-Request-Id]   # 允許客戶端腳本讀回的回應標頭
    allow_credentials: false          # 與 "*" 同時使用會被拒絕啟動（瀏覽器本就拒絕此組合）
    max_age_seconds: 600              # 預檢結果快取；0 = 不快取
